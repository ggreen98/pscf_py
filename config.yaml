# config.yaml
# Configuration for PSCF data prep and analysis.
# Applies to both CDPHE (EPA AQS) and Boulder AIR data sources.

# ---------------------------------------------------------------------------
# Analysis parameters — edit here to switch species or date range
# ---------------------------------------------------------------------------
analysis:
  species: "ethane_nox_ratio"    # one of: "O3", "NO", "NO2", "NOx", or a VOC compound name matching a BA column
                    # (e.g. "ethane", "propane" — see ba.species_config.voc.sites; BA only, no
                    # CDPHE equivalent). Quotes required; NO/YES are YAML booleans
  method: "cwt"   # one of "pscf" or "cwt" — default weighting scheme weighting_function() uses
                   # when PSCF.pscf()/PSCF.cwt() don't already say explicitly which one they are

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  cdphe_data_dir: /Users/gabegreenberg/Documents/GitHub/Front_Range_Ozone_Study/CDPHE_DATA
  ba_data_dir: /Users/gabegreenberg/Boulder_AIR/BoulderAIR_data
  trajectory_dir: "/Users/gabegreenberg/Boulder_AIR/Front Range Ozone Study/Trajectory_Files"
  output_dir: "/Users/gabegreenberg/Boulder_AIR/Front Range Ozone Study/pscf_py/output"

# ---------------------------------------------------------------------------
# Trajectory files
# ---------------------------------------------------------------------------
trajectories:
  # Subdirectory pattern inside trajectory_dir
  # Full path: {trajectory_dir}/Trajectory_Files_{YYYY}/{site_id}/{site_id}_{YYYYMMDD}_{HH}
  year_dir_prefix: Trajectory_Files_
  filename_pattern: "{site}_{YYYYMMDD}_{HH}"   # HH is zero-padded UTC hour (00–23)
  hours_back: -6                                 # back-trajectory length in hours
  format: HYSPLIT                                # single-trajectory endpoint files
  # Endpoint column positions (fixed-width, space-separated after header):
  # traj_num | met_grid | year | month | day | hour | minute | traj_age | lat | lon | height | pressure
  endpoint_columns:
    - traj_num
    - met_grid
    - year
    - month
    - day
    - hour
    - minute
    - traj_age   # hours relative to start (0, -1, -2, ... -12)
    - lat
    - lon
    - height_m_agl
    - pressure_hpa
  available_years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

# ---------------------------------------------------------------------------
# CDPHE / EPA AQS data
# ---------------------------------------------------------------------------
cdphe:
  description: >
    Hourly ozone from EPA AQS via CDPHE. Files already contain both local and
    GMT timestamps. Use the GMT columns — no conversion needed.
  time_zone: UTC
  timestamp_columns:
    date: date_gmt    # YYYY-MM-DD
    time: time_gmt    # HH:MM  (start of 1-hour averaging window, UTC)
  # Combine date_gmt + time_gmt -> UTC timestamp, left-label convention
  # (label 07:00 UTC = average over 07:00–08:00 UTC)
  concentration_column: sample_measurement
  concentration_units: ppm
  concentration_units_target: ppb
  ppm_to_ppb_factor: 1000
  file_pattern: "{site}_{species}_data.csv"
  o3_sites:
    - AURE    # Aurora East
    - BOUR    # Boulder Reservoir  (same location as BA site BRZ)
    - CAMP    # CAMP (Denver)
    - CASA    # La Casa
    - CHAT    # Chatfield Park
    - EVG     # Evergreen
    - FTC     # Fort Collins CSU
    - FTCW    # Fort Collins West
    - GRET    # Greeley Weld Co.
    - HLD     # Highland (Centennial)
    - NREL    # NREL South Table Mtn.
    - PAO     # Platteville Atmospheric Observatory (decommissioned Feb 2024)
    - RFN     # Rocky Flats North
    - ROMO    # Rocky Mountain NP
    - WBY     # Welby
  no_sites:
    - CAMP
    - CASA
    - I25DEN
    - I25GLO
    - PAO
    - RFN
    - ROMO    # NO only — no NO2 file available
    - WBY
  no2_sites:
    - CAMP
    - CASA
    - I25DEN
    - I25GLO
    - PAO
    - RFN
    - WBY
  nox_sites:              # sites with both NO and NO2 (required to compute NOx = NO + NO2)
    - CAMP
    - CASA
    - I25DEN
    - I25GLO
    - PAO
    - RFN
    - WBY

# ---------------------------------------------------------------------------
# Boulder AIR (BA) data
# ---------------------------------------------------------------------------
ba:
  description: >
    Minute-resolution ozone from Boulder AIR monitoring network. Unix timestamps
    in UTC (tz=0 in file header). Must be resampled to hourly before pairing
    with trajectories. Use left-closed, left-labeled bins to match AQS convention.
  time_zone: UTC
  timestamp_column: time        # Unix epoch seconds (UTC)
  concentration_units: ppb      # already in ppb — no conversion needed
  header_rows: 2                # row 0 = metadata (e.g. "o3,tz=0,v=1.1"), row 1 = column names
  resample_rule: "1h"           # pandas resample freq; left-label, left-closed
  resample_method: mean
  # NOTE: User stated a few early years of BRZ data were recorded in MST (UTC-7).
  # The current files in ba_data_dir/BRZ/ozone/ all show tz=0 — verify before
  # using any older BRZ data sourced from elsewhere.
  # mst_offset_hours: -7          # MST = UTC - 7 (no DST adjustment needed)
  # species_config: keyed by species name (match analysis.species exactly, or "voc" for any VOC compound)
  # Each entry has:
  #   subdir  : default subdirectory under {ba_data_dir}/{site}/
  #   col     : column to extract (null = auto-infer from metadata row; works for ozone only)
  #   sites   : dict of site_id -> per-site overrides (subdir, col, utc_offset_hours)
  # For VOC compounds (ethane, propane, etc.) set analysis.species to the compound name;
  # ba_read_in will look up the "voc" entry and use species.lower() as the column.
  species_config:
    "O3":
      subdir: ozone
      col: ~          # auto-inferred from metadata row ("o3,tz=0,...")
      sites:
        BSE: {}       # Broomfield Soaring Eagle Park
        CCF: {}       # Commerce City Fixed Site
        ECC: {}       # Erie Community Center
        LLG: {}       # Longmont Lykins Gulch
        LMA: {}       # Longmont (ozone only site)
        LNM: {}       # Longmont North Met
        LUR: {}       # Longmont Union Reservoir
        # BRZ excluded — its ozone record duplicates CDPHE site BOUR
    "NOx":
      subdir: nox
      col: nox        # "nox" column = NO + NO2 already summed
      sites:
        BRZ: {}
        LNM: {}
        LUR: {subdir: met}
        BSE: {subdir: met}    # NOx stored in met/ subdir at these sites
        CCF: {subdir: met}
    "NO":
      subdir: nox
      col: "no"       # quoted — bare no is a YAML boolean
      sites:
        BRZ: {}
        LNM: {}
        BSE: {subdir: met}
        CCF: {subdir: met}
    "NO2":
      subdir: met
      col: no2
      sites:
        CCF: {}       # only CCF has BA NO2 in met/
    voc:
      subdir: voc
      col: ~          # set by ba_read_in to species.lower() (e.g. "ethane")
      sites:
        BLV: {}
        BNP: {}
        BRZ: {}  # legacy 2017-2019 files in voc_2017_2019/ are MST
        BSE: {}
        CCF: {}       # has voc/ and voc2/ per quarter — read_ba_data merges horizontally
        CCM: {}
        ECC: {}
        LNM: {}
        LUR: {}

