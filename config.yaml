# ---------------------------------------------------------------------------
# PSCF parameters (matching traPSA defaults)
# ---------------------------------------------------------------------------
pscf:
  #mode: "multi_site"          # one of "single_site" or "multi_site"
  criterion_type: "percentile" # one of "percentile" or "value"
  criterion: .8               # "percentile": 0-1 fraction (0.8 = 80th percentile); "value": raw ppb threshold, applied per site
  per_site_threshold: true     # each site gets its own C_s, not a network-wide value
  trajectory_hours: 12         # hours of back trajectory to use
  cwt_statistic: "median"      # one of "mean" or "median" — per-cell CWT aggregation.
                                # median is more robust to outlier hours (e.g. a ratio
                                # metric spiking when its denominator is near zero).
  # Separate weighting schemes per analysis method — openair's trajLevel()
  # source (verified directly, see multi_site_pscf_notes.md §6) uses different
  # tier comparisons for pscf vs cwt, not just different numbers:
  #   pscf: tiers are MULTIPLES of the grid average (comparison: "relative")
  #         n_ij > tier_bounds[k] * avg -> tier_weights[k]
  #   cwt:  tiers are FIXED endpoint-count thresholds (comparison: "absolute")
  #         n_ij > tier_bounds[k]       -> tier_weights[k]
  # Selected by analysis.method, or overridden per-call via weighting_function(method=...).
  weight_function:
    pscf:
      weighting: "standard"        # one of "standard" (graduated tiers), "binary" (hard cutoff), "ss_scaled", "ss_scaled_balanced", "ss_scaled_pessimistic" to scale the probuility by sample size 95% CI's
      weighting_value: 20           # endpoint-count cutoff; only used when weighting: "binary" or "ss_scaled_balanced" where its used as "k", a calibration value
      comparison: "relative"
      tier_bounds: [2, 1, 0.5]
      tier_weights: [1.0, 0.75, 0.5]
      min_weight: 0.15
    cwt:
      weighting: "binary"
      weighting_value: 20
      comparison: "absolute"
      tier_bounds: [80, 20, 10]
      tier_weights: [1.0, 0.7, 0.42]
      min_weight: 0.05
  grid:
    lat_min: 37.0
    lat_max: 41.0
    lon_min: -109.0
    lon_max: -102.0
    dlat: 0.027      # ~3 km
    dlon: 0.035      # ~3 km

# ---------------------------------------------------------------------------
# Map / plotting (ResultMap) — kept top-level, not nested under pscf:, since
# ResultMap is generic over any 2D result grid (PSCF today, CWT/SQTBA later).
# ---------------------------------------------------------------------------
map:
  title: "Multi-Site {method} — {species}"  # {method} -> "PSCF"/"CWT", {species} -> analysis.species
  caption: ~                             # null -> auto-built from pscf criterion/weighting (default_caption())
  legend_caption:
    pscf: "PSCF probability"
    cwt: ~   # null -> auto-built from pscf.cwt_statistic ("Mean (ppb)" / "Median (ppb)")
  city_label_font_size: 22   # px — reference city name labels (always visible, not hover tooltips)
  zoom_start: 7
  title_font_size: 32     # px — title banner text
  caption_font_size: 26   # px — supplemental caption text under the title
  legend_scale: 1.8       # multiplier applied to branca's fixed-size legend (color bar + tick/caption text)
  scale_bar_font_size: 16 # px — distance scale bar text (NOT a transform/scale, which would distort its accuracy)
  # The weighting scheme is internal/technical detail most viewers don't need
  # on the map — hidden from the caption by default. Set true to show it.
  show_weighting: false
  # Only matters if show_weighting is also true. "relative"/"absolute"
  # thresholds is accurate but jargon most viewers won't recognize — off by
  # default. Set true to additionally spell out that PSCF's tiers are
  # multiples of the grid average while CWT's are fixed endpoint counts,
  # instead of just "Weighting: standard" for both.
  show_weighting_detail: false
  # Templates used by default_caption() to build the auto caption when
  # map.caption above is left null. {value}/{criterion_type} are filled in
  # from pscf.criterion / pscf.criterion_type. {weighting}/{comparison} come
  # from pscf.weight_function.<method>.weighting / .comparison — comparison
  # is only used by weighting_detailed (see show_weighting_detail above).
  caption_templates:
    criterion_percentile: "Criterion: {value:.0f}th percentile"
    criterion_value: "Criterion: {value} ({criterion_type})"
    weighting: "Weighting: {weighting}"
    weighting_detailed: "Weighting: {weighting} ({comparison} thresholds)"
    separator: " &nbsp;|&nbsp; "

# ---------------------------------------------------------------------------
# Column mapping (TrajectoryDataset)
# Maps whatever column names the raw pollution/trajectory dataframes actually
# use (left side) to the canonical names the rest of the pipeline expects
# (right side — must match the Output schema / Trajectory schema below).
# data_checker() validates against the left side (raw); prepare_data() renames
# left -> right. Edit the left side to match your own raw data if it differs.
# ---------------------------------------------------------------------------
column_mapping:
  pollution:
    site_id: site_id
    timestamp_utc: timestamp_utc
    ppb: ppb   # project_specific_functions.py readers already output 'ppb' directly
  trajectory:
    site_id: site_id
    timestamp_utc: timestamp_utc
    lat: lat
    lon: lon
    traj_age: traj_age

# ---------------------------------------------------------------------------
# Output schema
# All data sources must produce rows in this form before PSCF accumulation:
#   site_id       : str              (e.g. "FTC", "BRZ")
#   timestamp_utc : datetime64[UTC]  (start of 1-hour window, UTC)
#   species       : str              (e.g. "O3", "NO", "NO2")
#   ppb           : float64
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Trajectory schema
# This is the interface TrajectoryDataset depends on — any trajectory reader
# (HYSPLIT or otherwise) must produce rows in this form before pairing with
# concentration data. Swapping in a different back-trajectory model/met driver
# only requires a new reader that outputs this schema; TrajectoryDataset,
# Grid, and PSCF/CWT don't need to change.
#   site_id       : str              (e.g. "FTC", "BRZ")
#   timestamp_utc : datetime64[UTC]  (trajectory release hour — same label
#                                     convention as the paired concentration row)
#   traj_age      : float            (hours relative to release: 0 = receptor,
#                                     negative = back in time)
#   lat           : float64          (endpoint latitude)
#   lon           : float64          (endpoint longitude)
# Optional, carried along but not required by pairing/binning logic:
#   height_m_agl  : float64
#   pressure_hpa  : float64
# ---------------------------------------------------------------------------
